<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LifeAI OS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      user-select: none;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 36px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }
    .logo-container {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px auto;
      background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }
    .logo-container svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .spinner {
      display: inline-block;
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      border-top-color: #38bdf8;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.2);
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
      </svg>
    </div>
    <h1>LifeAI OS</h1>
    <div id="loading-state">
      <div class="spinner"></div>
      <p>Connecting to LifeAI Cloud...</p>
    </div>
    <div id="offline-state" style="display: none;">
      <div class="status-badge">
        <span>●</span> Offline Mode
      </div>
      <p>Unable to connect to the LifeAI OS server. Please check your internet connection.</p>
      <button class="btn" onclick="retryConnection()">Retry Connection</button>
    </div>
  </div>

  <script>
    const TARGET_URL = "https://life-connecte-port.apper.so";

    function checkConnection() {
      if (navigator.onLine) {
        window.location.href = TARGET_URL;
      } else {
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('offline-state').style.display = 'block';
      }
    }

    function retryConnection() {
      document.getElementById('offline-state').style.display = 'none';
      document.getElementById('loading-state').style.display = 'block';
      setTimeout(checkConnection, 800);
    }

    window.addEventListener('online', checkConnection);
    setTimeout(checkConnection, 1200);
  </script>
</body>
</html>
